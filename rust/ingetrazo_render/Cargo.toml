[package]
name = "ingetrazo_render"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
wgpu = "24"
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"

[features]
extension-module = ["pyo3/extension-module"]
